<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Fonds ancien">
  <!-- Panneau de DÉMONSTRATION, charte Gafeso. Dos de volumes alignés, de
       largeurs inégales — le rythme d'un rayonnage. Voir salle-de-lecture.svg
       pour la raison de charger la moitié haute. -->
  <rect width="1600" height="900" fill="#0E3F28"/>
  <g>
    <rect x="120" y="150" width="86" height="620" rx="6" fill="#1B5E3F"/>
    <rect x="216" y="196" width="58" height="574" rx="6" fill="#E07A2B"/>
    <rect x="284" y="128" width="104" height="642" rx="6" fill="#2E7D57"/>
    <rect x="398" y="210" width="72" height="560" rx="6" fill="#C4641F"/>
    <rect x="480" y="164" width="94" height="606" rx="6" fill="#1B5E3F"/>
    <rect x="584" y="240" width="54" height="530" rx="6" fill="#FBF6EA" fill-opacity=".82"/>
    <rect x="648" y="140" width="110" height="630" rx="6" fill="#2E7D57"/>
    <rect x="768" y="204" width="66" height="566" rx="6" fill="#E07A2B"/>
    <rect x="844" y="172" width="98" height="598" rx="6" fill="#1B5E3F"/>
    <rect x="952" y="232" width="60" height="538" rx="6" fill="#C4641F"/>
    <rect x="1022" y="146" width="102" height="624" rx="6" fill="#2E7D57"/>
    <rect x="1134" y="218" width="70" height="552" rx="6" fill="#FBF6EA" fill-opacity=".72"/>
