    <rect x="1382" y="158" width="106" height="612" rx="6" fill="#2E7D57"/>
  </g>
  <!-- Filets d'or : la tranche des volumes reliés. -->
  <g fill="#E9C46A" fill-opacity=".55">
    <rect x="132" y="300" width="62" height="7"/><rect x="296" y="270" width="80" height="7"/>
    <rect x="492" y="316" width="70" height="7"/><rect x="660" y="286" width="86" height="7"/>
    <rect x="856" y="324" width="74" height="7"/><rect x="1034" y="292" width="78" height="7"/>
