# ─────────────────────────────────────────────────────────────
# Gafeso — Déploiement de PRODUCTION
#
# Lance TOUT : infrastructure + api + web + reverse proxy (Caddy, HTTPS
# automatique). Contrairement à docker-compose.yml (dev — infra seule,
# app en `npm run dev` sur l'hôte), ici l'api et le web tournent dans
# des images construites depuis le dépôt (apps/api/Dockerfile,
# apps/web/Dockerfile) : le serveur exécute exactement le code du commit
# déployé, rien depuis l'hôte n'est monté en volume pour le code source.
#
# Procédure complète : voir DEPLOY.md à la racine du dépôt.
#
# Lancement :
#   docker compose --env-file .env.prod -f docker/docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────

# Nom de projet Compose : il PRÉFIXE les volumes, le réseau et les images.
# Le changer sur une install existante « détacherait » ses volumes — donc ses
# données. Le défaut reste l'historique `bibliocloud-prod` pour que toute
# installation antérieure démarre sans intervention ; install.sh écrit
# COMPOSE_PROJECT_NAME=gafeso-prod dans le .env.prod des NOUVELLES installations.
name: ${COMPOSE_PROJECT_NAME:-bibliocloud-prod}

services:
  # ── PostgreSQL 16 : base de données principale ──
  # Pas de port publié à l'hôte : uniquement joignable depuis le réseau
  # Docker interne (api). Utiliser `docker compose exec db psql ...` pour
  # une intervention manuelle.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-bibliocloud}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bibliocloud} -d ${POSTGRES_DB:-bibliocloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Meilisearch : moteur de recherche (OPAC) ──
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY requis (32 caractères aléatoires minimum en prod)}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # /health n'exige jamais de clé (endpoint volontairement ouvert par
      # Meilisearch pour les sondes d'infra, y compris avec une master key).
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Garage : stockage objet S3 (fichiers numériques, couvertures) ──
  #
  # 🔴 POURQUOI PLUS MinIO : son image officielle n'est plus téléchargeable
  # anonymement depuis Docker Hub — mesuré le 13 octobre 2026 avec ses deux
  # témoins (une image publique quelconque se télécharge ; un dépôt inventé rend
  # le MÊME refus). Ni le tag, ni le DIGEST, ni aucun miroir public ne la
  # servent : le refus porte sur le DÉPÔT, donc épingler l'empreinte ne sauve
  # rien. Une installation NEUVE ne pouvait plus démarrer.
  #
  # Garage est AGPL-3.0 comme Gafeso, pèse 32 Mo d'image et 21 Mo de mémoire au
  # repos. Sa répétition complète est dans ce dépôt et REJOUABLE :
  # `scripts/recette/garage-repetition.sh` — six points mesurés, dont la
  # migration vérifiée objet par objet et une restauration prouvée.
  #
  # ⚠ DEUX DIFFÉRENCES D'ARCHITECTURE, mesurées, qui expliquent ce bloc :
  #   · Garage n'implémente PAS `PutBucketPolicy` : la lecture publique des
  #     couvertures passe par son point d'entrée WEB, où le bucket est choisi
  #     par le NOM D'HÔTE. Le bucket public porte donc ${STORAGE_DOMAIN} pour
  #     nom, et l'application cesse de répéter le bucket dans le chemin
  #     (STORAGE_PUBLIC_BUCKET_IN_PATH=false).
  #   · son image ne contient NI sh, NI tar, NI busybox : on n'y exécute rien.
  #     L'initialisation passe par son API d'ADMINISTRATION, et une sauvegarde
  #     se prend par un conteneur AUXILIAIRE qui monte les volumes.
  garage:
    image: dxflrs/garage@sha256:58e68794286868230708803e50495bfe7d1d1c7b696e0c2dee99b03c524fc960
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET requis (32 octets hex)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN requis (32 octets hex)}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # ⚠ AUCUN PORT PUBLIÉ : ni S3, ni web, ni administration. Tout passe par
    # Caddy, et l'API d'administration ne sort JAMAIS du réseau du compose.
    healthcheck:
      # ⚠ `/health` de l'API d'administration, SANS jeton : il est ouvert
      # exprès pour cet usage. Et l'image n'a pas de shell, donc la sonde est
      # le binaire lui-même.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Initialisation de Garage : UNE FOIS, et sans aucun geste manuel ──
  #
  # ⭐ Elle est IDEMPOTENTE, et c'est mesuré en la lançant DEUX FOIS : même
  # nombre de buckets et de clés après. `restart: "no"` suffit donc — un
  # redémarrage du compose la rejoue sans rien casser.
  #
  # ⚠ Elle emploie l'image de l'API parce que celle de Garage ne peut rien
  # exécuter. Elle ne demande PAS la base : elle ne parle qu'à l'API
  # d'administration de Garage.
  garage-init:
    # ⭐ LE MÊME BUILD QUE L'API, et non une image à TÉLÉCHARGER.
    #
    # 🔴 MESURÉ : avec `image: gafeso-api:local`, le compose a tenté de la
    # TIRER d'un registre et a rendu « pull access denied for gafeso-api,
    # repository does not exist ». L'image est construite ici, elle n'existe
    # dans aucun registre — et c'est `cause_en_clair` qui l'a nommé, sinon je
    # lisais « le démarrage a échoué » et rien d'autre.
    #
    # ⚠ Compose construit l'image UNE FOIS et la partage entre les deux
    # services qui déclarent le même build : il n'y a pas de construction en
    # double.
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      # LA VERSION QUI TOURNE — posée par `eval "$(scripts/version-du-depot.sh --exporter)"`
      # AVANT le build. Absente, le Dockerfile rend « non étiquetée », qui est la
      # réponse honnête — jamais un numéro plausible.
      # ⚠ La web n'en reçoit PAS : elle lit `GET /health`. Deux sources pour une
      # même valeur s'accordent PAR COÏNCIDENCE jusqu'au jour où l'une bouge.
      args:
        # 🔴 PLUS AUCUN DÉFAUT ICI, ET C'EST LE POINT.
        #
        # `${GAFESO_VERSION:-non étiquetée}` substituait une réponse HONNÊTE à
        # une version ABSENTE — donc un `up -d --build` lancé sans
        # `eval "$(scripts/version-du-depot.sh --exporter)"` produisait une image
        # qui répond « non étiquetée / inconnu », SANS AUCUN AVERTISSEMENT.
        # Constaté au déploiement de rc7 sur la démonstration, 9 octobre 2026.
        #
        # ⚠ Le défaut était défendable en soi — « dire la vérité plutôt qu'un
        # numéro plausible ». Il était faux à CET endroit : il rendait l'oubli
        # indiscernable du choix. Sans lui, la variable arrive VIDE et l'image
        # REFUSE de se construire en disant quoi lancer.
        GAFESO_VERSION: ${GAFESO_VERSION}
        GAFESO_COMMIT: ${GAFESO_COMMIT}
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      # ⚠ LES DEUX SECRETS QU'ELLE EMPLOIE, ET EUX SEULS : ce sont les
      # identifiants S3 qu'elle IMPORTE dans Garage. Elle ne reçoit ni le mot
      # de passe de la base, ni la clé de l'index, ni la KEK des documents —
      # elle n'en a aucun usage, et un conteneur qui porte un secret qu'il ne
      # peut pas employer est un secret de plus à voler.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      STORAGE_PUBLIC_DOMAIN: ${STORAGE_DOMAIN}
      GARAGE_KEY_NAME: gafeso
    # ⭐ LE POINT D'ENTRÉE DE L'IMAGE EST CONTOURNÉ, ET C'EST MESURÉ.
    #
    # Il fait DEUX choses qu'une initialisation de stockage ne doit pas faire :
    #   ① il exige les CINQ secrets de production — mesuré, il a refusé ce
    #      service en les nommant un par un. Or l'initialisation ne parle qu'à
    #      l'API d'administration de Garage : lui donner le mot de passe de la
    #      base et la KEK des documents serait l'inverse du moindre privilège ;
    #   ② 🔴 il applique `prisma migrate deploy`. Une initialisation de
    #      STOCKAGE qui migre la base au passage est un effet de bord que
    #      personne n'a demandé — et il arriverait AVANT que l'API démarre.
    #
    # ⚠ Ce n'est donc pas un garde qu'on relâche : c'est un point d'entrée
    # écrit pour l'API, employé par un service qui n'est pas l'API. Le garde
    # des secrets continue de s'appliquer à `api`, qui est son objet.
    entrypoint: ["node"]
    # ⚠ SANS « node » : l'entrypoint ci-dessus EST node. Les deux ensemble
    # lanceraient `node node scripts/…`.
    command: ["scripts/lib/garage-initialiser.mjs"]


  # ── API NestJS ──
  # Le point d'entrée de l'image (docker-entrypoint.sh) applique les
  # migrations Prisma en attente (`prisma migrate deploy`, idempotent) AVANT
  # de démarrer le serveur — aucune étape manuelle à la mise à jour.
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      # LA VERSION QUI TOURNE — posée par `eval "$(scripts/version-du-depot.sh --exporter)"`
      # AVANT le build. Absente, le Dockerfile rend « non étiquetée », qui est la
      # réponse honnête — jamais un numéro plausible.
      # ⚠ La web n'en reçoit PAS : elle lit `GET /health`. Deux sources pour une
      # même valeur s'accordent PAR COÏNCIDENCE jusqu'au jour où l'une bouge.
      args:
        # 🔴 PLUS AUCUN DÉFAUT ICI, ET C'EST LE POINT.
        #
        # `${GAFESO_VERSION:-non étiquetée}` substituait une réponse HONNÊTE à
        # une version ABSENTE — donc un `up -d --build` lancé sans
        # `eval "$(scripts/version-du-depot.sh --exporter)"` produisait une image
        # qui répond « non étiquetée / inconnu », SANS AUCUN AVERTISSEMENT.
        # Constaté au déploiement de rc7 sur la démonstration, 9 octobre 2026.
        #
        # ⚠ Le défaut était défendable en soi — « dire la vérité plutôt qu'un
        # numéro plausible ». Il était faux à CET endroit : il rendait l'oubli
        # indiscernable du choix. Sans lui, la variable arrive VIDE et l'image
        # REFUSE de se construire en disant quoi lancer.
        GAFESO_VERSION: ${GAFESO_VERSION}
        GAFESO_COMMIT: ${GAFESO_COMMIT}
    restart: unless-stopped
    depends_on:
      # ⭐ ET L'INITIALISATION DOIT AVOIR TERMINÉ, pas seulement démarré.
      #
      # 🔴 MESURÉ en montant la pile : sans cette ligne, `up -d api` ne lance
      # PAS `garage-init` — il n'est la dépendance de personne. L'API démarrait
      # sur un Garage sans bucket et sortait sur « AccessDenied » suivi de vingt
      # lignes de SDK, qui n'accusent rien.
      #
      # ⚠ `service_completed_successfully` et non `service_started` : un
      # initialiseur qui a COMMENCÉ n'a pas fini de poser les buckets, et l'API
      # les cherche dès son premier souffle.
      garage-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_URL: ${APP_URL:?APP_URL requis (ex. https://bibliotheque.gafeso.exemple)}
      # Adresse PUBLIQUE de l'API, telle qu'un appareil mobile hors du réseau
      # doit la joindre. Distincte de l'URL interne (api:4000) : c'est celle que
      # /.well-known/gafeso.json publie après le scan du QR d'établissement.
      API_PUBLIC_URL: ${API_DOMAIN:?API_DOMAIN requis (ex. https://api.bibliotheque.gafeso.exemple)}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bibliocloud}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bibliocloud}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (32 caractères aléatoires minimum)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY requis (24 caractères aléatoires minimum)}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MINIO_ENDPOINT: garage
      MINIO_PORT: 3900
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # URL publique du bucket "covers" (voir Caddyfile, sous-domaine storage.*)
      # — sans elle, les URLs de couverture générées pointeraient vers le nom
      # interne "minio", injoignable depuis le navigateur.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL requis (ex. https://storage.bibliotheque.gafeso.exemple)}
      # ⚠ AVEC GARAGE, LE BUCKET N'EST PAS DANS LE CHEMIN : son point d'entrée
      # web choisit le bucket par le NOM D'HÔTE, et le bucket public porte
      # ${STORAGE_DOMAIN} pour nom. Répéter « covers » dans le chemin donnerait
      # un 404 — mesuré sur une pile jetable.
      STORAGE_PUBLIC_BUCKET_IN_PATH: "false"
      # ⚠ ET SON NOM N'EST PLUS « covers » : le bucket public porte le DOMAINE,
      # parce que le point d'entrée web de Garage choisit le bucket par le nom
      # d'hôte. Mesuré : avec « covers » câblé en dur, l'API créait un bucket
      # parasite et ne trouvait pas celui de l'initialisation.
      STORAGE_PUBLIC_BUCKET: ${STORAGE_DOMAIN}
      # SMTP réel — voir DEPLOY.md « Configurer le SMTP réel ». Laissé vide
      # par défaut : l'app démarre quand même et journalise les emails au
      # lieu de les envoyer (mode dégradé explicite, jamais un crash).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}   # vide = déduit du port par MailService
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Gafeso <no-reply@gafeso.local>}
      # ── Cœur offline (module offline-licensing) ──
      # Sans ces deux clés l'api REFUSE de démarrer (garde-fou OfflineKeysService).
      # install.sh les génère dans .env.prod ; en installation manuelle, voir
      # .env.prod.example (KEK 32 octets base64 + Ed25519 PEM PKCS8 sur UNE ligne,
      # retours à la ligne échappés en \n — un env_file ne gère pas le multiligne).
      OFFLINE_CONTENT_KEK: ${OFFLINE_CONTENT_KEK:?OFFLINE_CONTENT_KEK requis (32 octets base64, voir .env.prod.example)}
      OFFLINE_LICENSE_PRIVATE_KEY: ${OFFLINE_LICENSE_PRIVATE_KEY:?OFFLINE_LICENSE_PRIVATE_KEY requis (Ed25519 PEM PKCS8 sur une ligne, voir .env.prod.example)}
    healthcheck:
      # 127.0.0.1, jamais "localhost" : dans l'image Alpine, `getent hosts
      # localhost` résout en IPv6 (::1) avant l'IPv4 — voir le commentaire
      # détaillé sur le healthcheck du service `web` ci-dessous, qui touche
      # concrètement les deux services même si l'API (bind dual-stack par
      # défaut de Node, `app.listen(port)` sans host) n'est en réalité pas
      # affectée. Gardé cohérent sur les deux pour ne pas dépendre de ce
      # détail d'implémentation.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend Next.js ──
  # API_URL est un ARG DE BUILD (pas une variable d'environnement runtime) :
  # next.config.mjs le lit pour construire le rewrite /api/* → figé dans la
  # sortie standalone au moment de `next build`. Voir le commentaire dans
  # apps/web/Dockerfile. Le changer implique un rebuild de cette image.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # URL INTERNE de l'API (réseau Docker) pour le rendu SERVEUR des pages
      # (Server Components — ex. l'accueil « / » qui appelle GET /tenancy/home
      # via lib/server-api.ts → process.env.API_URL). Distincte du build-arg
      # API_URL ci-dessus : celui-là fige le rewrite /api/* au BUILD, mais la
      # sortie standalone ne conserve PAS cet ENV au runtime — sans cette
      # ligne, le fetch serveur retombe sur http://localhost:4000 et l'accueil
      # affiche le repli minimal. Même valeur que le service API (api:4000).
      API_URL: http://api:4000
    healthcheck:
      # 127.0.0.1, jamais "localhost" : constaté en prod, le conteneur
      # restait "unhealthy" (wget: can't connect to remote host: Connection
      # refused) alors que les logs montraient Next bien démarré ("Ready").
      # Cause : dans l'image Alpine, "localhost" résout en IPv6 (::1)
      # AVANT l'IPv4 (`getent hosts localhost` → ::1 en premier), mais
      # Next.js standalone avec HOSTNAME=0.0.0.0 (voir Dockerfile) n'écoute
      # QU'en IPv4 — `/proc/net/tcp6` ne montre aucun listener. wget suit la
      # résolution IPv6 en premier, se fait refuser la connexion, et
      # n'essaie pas l'IPv4 ensuite. 127.0.0.1 contourne la résolution DNS.
      # ⚠ LA SONDE N'INTERROGE PLUS `/`, ET LES DEUX MOTIFS COMPTENT.
      #
      # 1. Le rendu serveur de l'accueil transmet le Host à l'API pour résoudre
      #    l'école. La sonde parle depuis 127.0.0.1, qui n'est le domaine
      #    d'aucun établissement : l'API journalisait un avertissement JUSTE
      #    toutes les dix secondes — 8 640 par jour. Le message doit rester
      #    (c'est la seule trace du domaine exact reçu le jour où un vrai
      #    client est mal configuré) ; c'est son ÉMETTEUR qui n'avait rien à
      #    faire là.
      # 2. Une sonde qui rend l'accueil mesure l'API, la base et Meilisearch en
      #    plus du serveur web : API tombée, Docker redémarrait `web`, le
      #    conteneur qui allait bien. Une sonde ne doit mesurer que ce que son
      #    redémarrage peut réparer.
      #
      # `/.well-known/sante` est un gestionnaire de route qui n'appelle rien.
      # Le préfixe `.well-known/` est déjà public dans middleware.ts — aucune
      # surface publique nouvelle.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/.well-known/sante"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Caddy : reverse proxy + HTTPS automatique (Let's Encrypt) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      # Ports HÔTE surchargeables (défauts 80/443 pour un vrai déploiement).
      # Un installateur en mode localhost/essai, ou un serveur derrière un
      # load-balancer, peut les remapper (ex. HTTP_PORT=8080) sans toucher au
      # conteneur — voir install.sh.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3 (QUIC)
    environment:
      # Domaines — voir DEPLOY.md. PUBLIC_DOMAIN peut être un domaine unique
      # ou (recommandé, multi-établissements) un domaine avec sous-domaines
      # par école (ex. bibliotheque.gafeso.exemple) déclarés séparément dans le
      # Caddyfile si besoin d'un certificat par école.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN requis (ex. bibliotheque.gafeso.exemple)}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN requis (ex. api.bibliotheque.gafeso.exemple) — un bloc Caddy avec une adresse vide empêche le démarrage, ce domaine n'est donc pas optionnel}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?STORAGE_DOMAIN requis (ex. storage.bibliotheque.gafeso.exemple)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL requis (contact certificats Let's Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  meili_data:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:
